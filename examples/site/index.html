<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("opengrid-theme");
          if (["system", "light", "dark"].includes(saved)) preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.ogThemePreference = preference;
        document.documentElement.dataset.ogTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta
      name="description"
      content="An independent MIT React and TypeScript data grid. Explore the live demo, read the docs, and build with an open framework-neutral core."
    />
    <title>OpenGrid — Make room for your data.</title>
    <link rel="icon" type="image/svg+xml" href="/opengrid/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
